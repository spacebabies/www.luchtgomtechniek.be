{{ $opts := dict
  "target" "es2020"
  "targetPath" "main.js"
  "minify" (not hugo.IsDevelopment)
  "sourceMap" (cond hugo.IsDevelopment "inline" "none")
}}

{{ with resources.Get "js/ready.js" | js.Build $opts | fingerprint }}
  <script defer type="text/javascript" src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
{{ end }}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script type="application/ld+json">
  {{ $address := dict
    "@type" "PostalAddress"
    "streetAddress" .Site.Params.adrStreet
    "addressLocality" .Site.Params.adrCity
    "addressRegion" .Site.Params.adrLocality
    "postalCode" .Site.Params.adrPostcode
    "addressCountry" .Site.Params.adrCountry
    "description" (i18n "address.description")
  -}}
  {{ dict
    "@context" "https://schema.org"
    "@type" "LocalBusiness"
    "@id" (ref . "/")
    "name" .Site.Title
    "image" ($.Scratch.Get "key-art").Permalink
    "address" $address
    "url" (ref . "/")
    "telephone" .Site.Params.phone
    "priceRange" "$$$"
    "email" .Site.Params.email | jsonify (dict "indent" "\t") | safeJS }}
</script>
