{{ $opts := dict
  "target" "es2020"
  "minify" (not hugo.IsDevelopment)
}}

{{ with resources.Get "js/main.js" | js.Build $opts | fingerprint }}
  <script defer type="text/javascript" src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
{{ end }}

<script type="application/ld+json">
  {{ $address := dict
    "@type" "PostalAddress"
    "streetAddress" .Site.Params.adrStreet
    "addressLocality" .Site.Params.adrCity
    "addressRegion" .Site.Params.adrLocality
    "postalCode" .Site.Params.adrPostcode
    "addressCountry" .Site.Params.adrCountry
    "description" (i18n "address.description")
  -}}
  {{ $areaServed := slice
    (dict "@type" "Country" "name" "Belgium")
    (dict "@type" "Country" "name" "Netherlands")
  -}}
  {{ $serviceOffers := slice }}
  {{ range .Site.Params.services }}
    {{ $serviceOffers = $serviceOffers | append (dict "@type" "Offer" "itemOffered" (dict "@type" "Service" "name" .)) }}
  {{ end }}
  {{ $offers := dict
    "@type" "OfferCatalog"
    "name" "Services"
    "itemListElement" $serviceOffers
  -}}
  {{ dict
    "@context" "https://schema.org"
    "@type" "LocalBusiness"
    "@id" (ref . "/")
    "name" .Site.Title
    "image" ($.Scratch.Get "key-art").Permalink
    "address" $address
    "url" (ref . "/")
    "telephone" .Site.Params.phone
    "priceRange" "$$$"
    "vatID" "BE0760813758"
    "areaServed" $areaServed
    "sameAs" (slice "https://www.instagram.com/luchtgomtechniek/")
    "hasOfferCatalog" $offers
    "email" .Site.Params.email | jsonify (dict "indent" "\t") | safeJS }}
</script>
