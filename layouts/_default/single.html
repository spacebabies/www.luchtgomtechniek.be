{{ define "main" }}
<section class="content single-page">
  <div class="post-holder">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
      </header>
      <div class="post-content">
        {{ .Content }}
      </div>
    </article>
  </div>
</section>
{{ end }}
