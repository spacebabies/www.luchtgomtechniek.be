<form netlify name="prijsopgave">
    <p><label>
        {{ i18n "label_name" }}
        <input type="text" name="naam" required maxlength="200">
    </label></p>

    <p><label>
        {{ i18n "label_email" }}
        <input type="email" name="email" required maxlength="200">
    </label></p>

    <p><label>
        {{ i18n "label_telephone" }}
        <input type="tel" name="telephone" required maxlength="20">
    </label></p>

    <p><label>
      {{ i18n "label_short_desc" }}
      <textarea name="short_desc" maxlength="2000"></textarea>
    </label></p>

    <p>
        <label>
            {{ i18n "label_werk" }}
            <input type="file" name="werk">
        </label>
    </p>

    <p>
        <input type="submit" value='{{ i18n "button_send" }}'>
    </p>
</form>
