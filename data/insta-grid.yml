- id: DTqwu7WjTAy
  description:
    nl: "Voor dit project hebben wij de bakstenen gewelven en muren gestraald en voorzien van nieuwe voegen in créme, de ijzeren spanten meegestraald en afgewerkt in matzwart. Op de verdieping hebben wij de eiken balken mogen stralen.\nHet geheel is nu bijzonder smaakvol met de oude elementen mooi zichtbaar."
    fr: "Pour ce projet, nous avons sablé les voûtes et les murs en briques et appliqué de nouveaux joints couleur crème, sablé les fermes en fer et les avons finies en noir mat. À l'étage, nous avons eu l'occasion de sabler les poutres en chêne.\nL'ensemble est désormais très élégant avec les anciens éléments joliment mis en valeur."
  image: "images/insta-grid/luchtgommen-bakstenen-gewelven.webp"
