- id: DNGI_WENm74
  description:
    nl: "Voor de nieuwe rondleiding in Kasteel Aldenbiesen hebben wij de bruine stoelen en tafelbladen van het voormalig restaurant gedeelte gestraald en daarna naturel afgewerkt. Een mooi tweede leven voor deze oerdegelijke en charmante meubelstukken."
    fr: "Pour la nouvelle visite du Château d'Alden Biesen, nous avons sablé les chaises brunes et les plateaux de table de l'ancienne partie restaurant pour ensuite leur donner une finition naturelle. Une belle seconde vie pour ces meubles très solides et charmants."
  image: "images/insta-grid/luchtgommen-kasteel-aldenbiesen.webp"
