- id: DTqwu7WjTAy
  alt:
    nl: "Gestraalde bakstenen gewelven en muren met crème voegen"
    fr: "Voûtes et murs en briques sablés avec des joints crème"
  description:
    nl: "Voor dit project hebben wij de bakstenen gewelven en muren gestraald en voorzien van nieuwe voegen in créme, de ijzeren spanten meegestraald en afgewerkt in matzwart. Op de verdieping hebben wij de eiken balken mogen stralen.\nHet geheel is nu bijzonder smaakvol met de oude elementen mooi zichtbaar."
    fr: "Pour ce projet, nous avons sablé les voûtes et les murs en briques et appliqué de nouveaux joints couleur crème, sablé les fermes en fer et les avons finies en noir mat. À l'étage, nous avons eu l'occasion de sabler les poutres en chêne.\nL'ensemble est désormais très élégant avec les anciens éléments joliment mis en valeur."
  image: "images/insta-grid/luchtgommen-bakstenen-gewelven.webp"
- id: DU8ujVVjRPL
  alt:
    nl: "Honda Camino motorframe gestraald"
    fr: "Cadre de moto Honda Camino sablé"
  description:
    nl: "Honda Camino Starter Pack. Het stralen van motorframes is één van onze specialiteiten. Door het gebruik van fijn straalgrit en lagere druk hoeven schroefgaten niet per se toegestopt te worden, zelfs het chassisnummer blijft geheel intact."
    fr: "Pack de démarrage Honda Camino. Le sablage de cadres de motos est l'une de nos spécialités. Grâce à l'utilisation d'abrasif fin et d'une pression plus basse, il n'est pas nécessaire de boucher les trous de vis, et même le numéro de châssis reste intact."
  image: "images/insta-grid/luchtgommen-honda-camino.webp"
- id: DNGI_WENm74
  alt:
    nl: "Gestraalde houten stoelen en tafels van Kasteel Aldenbiesen"
    fr: "Chaises et tables en bois sablées du Château d'Alden Biesen"
  description:
    nl: "Voor de nieuwe rondleiding in Kasteel Aldenbiesen hebben wij de bruine stoelen en tafelbladen van het voormalig restaurant gedeelte gestraald en daarna naturel afgewerkt. Een mooi tweede leven voor deze oerdegelijke en charmante meubelstukken."
    fr: "Pour la nouvelle visite du Château d'Alden Biesen, nous avons sablé les chaises brunes et les plateaux de table de l'ancienne partie restaurant pour ensuite leur donner une finition naturelle. Une belle seconde vie pour ces meubles très solides et charmants."
  image: "images/insta-grid/luchtgommen-kasteel-aldenbiesen.webp"
- id: DKYkcT-oZrC
  alt:
    nl: "Houten trap gestraald en cementtegels opgescrubt in Luik"
    fr: "Escalier en bois sablé et carreaux de ciment nettoyés à Liège"
  description:
    nl: "In dit pand in Luik de trap gestraald en een 2e trap in het achterhuis, de authentieke cementtegels machinaal opgescrubt. Daarna alles voorzien van een naturelle transparante afwerking."
    fr: "Dans ce bâtiment à Liège, nous avons sablé l'escalier ainsi qu'un deuxième escalier à l'arrière, et nous avons nettoyé mécaniquement les carreaux de ciment authentiques. Ensuite, tout a été pourvu d'une finition transparente naturelle."
  image: "images/insta-grid/luchtgommen-trap-luik.webp"
- id: DKF4RSQtcjy
  alt:
    nl: "Houten bijzettafeltje gered door luchtgommen"
    fr: "Table d'appoint en bois sauvée par aérogommage"
  description:
    nl: "Vol goede moed was deze klant begonnen om met verfafbijt haar geliefde tafeltje te ontdoen van verf en de bruine vernis, maar pakte niet uit zoals gehoopt, het werd een knoeiboel. Wij hebben het klusje uiteindelijk mogen afmaken."
    fr: "Pleine de bonne volonté, cette cliente avait commencé à décaper sa table adorée pour enlever la peinture et le vernis brun, mais cela ne s'est pas passé comme espéré, c'est devenu un gâchis. Nous avons finalement pu terminer le travail."
  image: "images/insta-grid/luchtgommen-tafeltje.webp"
- id: DJo3enuI7vz
  alt:
    nl: "Ideale hechting voor plamuur na stralen motorframe"
    fr: "Adhérence idéale pour le mastic après sablage du cadre de la moto"
  description:
    nl: "Onze straalmethode geeft een ideale hechting voor plamuur en/of primer. Geen nood aan fillers en geen sinaasappelhuid na afwerking. Wij kunnen als afwerking aanbieden: 👉 glasparelstralen 200 µm 👉 metallisatie en/of poedercoating 👉 afwerking met natlak. Deze klant gaat licht plamuren en zelf afwerken met natlak."
    fr: "Notre méthode de sablage offre une adhérence idéale pour le mastic et/ou l'apprêt. Pas besoin de fillers et pas d'effet peau d'orange après la finition. Nous proposons comme finition : 👉 microbillage 200 µm 👉 métallisation et/ou thermolaquage 👉 finition à la peinture liquide. Ce client va légèrement mastiquer et finir lui-même à la peinture liquide."
  image: "images/insta-grid/luchtgommen-motorframe.webp"
