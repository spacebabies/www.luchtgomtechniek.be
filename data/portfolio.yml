- id: trap-deuren-schouw-vensterbanken
  title:
    nl: "Interieur verjongd"
    fr: "Intérieur rajeuni"
  description:
    nl: "Totaalrenovatie ademt nieuw leven in klassiek pand. Trap, deuren, schouw en vensterbanken zorgvuldig gestraald en afgewerkt. Warme houtaccenten en witte muren creëren lichte, uitnodigende sfeer. Ambachtelijk vakmanschap herstelt oorspronkelijke charme."
    fr: "Rénovation complète insuffle une nouvelle vie à une demeure classique. Escalier, portes, cheminée et appuis de fenêtre soigneusement décapés et finis. Accents chaleureux du bois et murs blancs créent une atmosphère lumineuse et accueillante. L'artisanat restaure le charme d'origine."
  images: "trap-deuren-schouw-vensterbanken/*.jpg"
  location: ""
  coordinates:
    lat: null
    lng: null

