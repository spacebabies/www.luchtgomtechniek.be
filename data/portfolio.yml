- id: sintpieter
  title:
    nl: "Trappenhuis, Sint Pieter (Maastricht)"
    fr: "Cage d'escalier, Saint-Pierre (Maastricht)"
  description:
    nl: "Vakkundige restauratie van een monumentaal trappenhuis. Houtwerk geluchtgomd om de authentieke schoonheid te herstellen, met behoud van historische details. Perfecte balans tussen erfgoed en moderne afwerking."
    fr: "Restauration experte d'une cage d'escalier monumentale. Boiseries aérogommées pour retrouver leur beauté authentique, tout en préservant les détails historiques. Équilibre parfait entre patrimoine et finition moderne."
  image: "images/portfolio/sintpieter.jpg"
  location: "Maastricht, Sint Pieter"
  coordinates:
    lat: 50.835
    lng: 5.690

- id: stadsvilla-luik
  title:
    nl: "Blauwstenen entree gerestaureerd"
    fr: "Entrée en pierre bleue restaurée"
  description:
    nl: "Stadsvilla Luik: verweerde entree vakkundig gereinigd. Blauwstenen trappen, zuilen en ornamenten herwonnen hun grandeur. Elegante metamorfose met behoud van historische charme."
    fr: "Hôtel particulier liégeois : entrée usée nettoyée avec expertise. Escaliers, colonnes et ornements en pierre bleue ont retrouvé leur grandeur. Métamorphose élégante préservant le charme historique."
  image: "images/portfolio/stadsvilla-luik.jpg"
  location: "Luik"
  coordinates:
    lat: 50.632
    lng: 5.567

- id: hasselt-gevelpanelen
  title:
    nl: "Gevelbekleding vernieuwd in Hasselt"
    fr: "Revêtement de façade rénové à Hasselt"
  description:
    nl: "Strakke metamorfose: houten gevelpanelen gestraald en verfrist. Harmonieus samenspel van ceder en baksteen creëert eigentijdse look. Vakmanschap zorgt voor duurzame upgrade van moderne woning."
    fr: "Métamorphose épurée : panneaux de façade en bois décapés et rafraîchis. Jeu harmonieux entre cèdre et brique crée un look contemporain. Savoir-faire assurant une amélioration durable de l'habitation moderne."
  image: "images/portfolio/hasselt-gevelpanelen.jpg"
  location: "Hasselt"
  coordinates:
    lat: 50.930
    lng: 5.332

- id: huy
  title:
    nl: "Trappenhuis Huy herleeft"
    fr: "La cage d'escalier de Huy reprend vie"
  description:
    nl: "Verborgen parel onthuld: eeuwenoud trappenhuis in Huy gestraald en verfijnd. Originele houtnerf en authentieke details komen tot leven. Vakkundige renovatie blaast historie nieuw leven in."
    fr: "Joyau caché dévoilé : cage d'escalier séculaire à Huy décapée et raffinée. Grain de bois original et détails authentiques reprennent vie. Rénovation experte insuffle une nouvelle vie à l'histoire."
  image: "images/portfolio/huy.jpg"
  location: "Huy"
  coordinates:
    lat: 50.518
    lng: 5.235

- id: trappenhuis-bilzen
  title:
    nl: "Bilzens trappenhuis in ere hersteld"
    fr: "Cage d'escalier de Bilzen restaurée dans les règles de l'art"
  description:
    nl: "Houten trappenhuis zorgvuldig gestraald en naturel afgewerkt. Vloeiende lijnen en lichte tinten creëren ruimtelijk effect. Vakmanschap zorgt voor naadloze integratie van authentieke elementen in modern interieur."
    fr: "Cage d'escalier en bois soigneusement décapée et finie au naturel. Lignes fluides et teintes claires créent un effet spatial. Le savoir-faire assure une intégration parfaite des éléments authentiques dans un intérieur moderne."
  image: "images/portfolio/trappenhuis-bilzen.jpg"
  location: "Bilzen"
  coordinates:
    lat: 50.871
    lng: 5.516

- id: spa
  title:
    nl: "School, Spa"
    fr: "École, Spa"
  description:
    nl: "Cederhouten buitenschrijnwerk vakkundig gestraald. Natuurlijke schoonheid van hout hersteld, bestand tegen weersinvloeden. Zorgvuldige aanpak beschermt erfgoed en verbetert leeromgeving."
    fr: "Menuiseries extérieures en cèdre expertement décapées. Beauté naturelle du bois restaurée, résistante aux intempéries. Approche minutieuse protège le patrimoine et améliore l'environnement d'apprentissage."
  image: "images/portfolio/spa.jpg"
  location: "Spa"
  coordinates:
    lat: 50.492
    lng: 5.864

