    fr: "Cage d'escalier de Bilzen restaurée dans les règles de l'art"
  description:
    nl: "Houten trappenhuis zorgvuldig gestraald en naturel afgewerkt. Vloeiende lijnen en lichte tinten creëren ruimtelijk effect. Vakmanschap zorgt voor naadloze integratie van authentieke elementen in modern interieur."
    fr: "Cage d'escalier en bois soigneusement décapée et finie au naturel. Lignes fluides et teintes claires créent un effet spatial. Le savoir-faire assure une intégration parfaite des éléments authentiques dans un intérieur moderne."
  images: "trappenhuis-bilzen/*.jpg"
  location: "Bilzen"
  coordinates:
    lat: 50.871
    lng: 5.516

- id: overslagterminal
  title:
    nl: "Overslagterminal, Beringen"
    fr: "Terminal de transbordement, Beringen"
  description:
    nl: "Industriële facelift: inox onderdelen ter plaatse geglasparelstraald. Precisiewerk op werf en bij constructeur zorgt voor uniforme, stralende afwerking. Duurzame oplossing verhoogt efficiëntie en uitstraling van overslagfaciliteit."
    fr: "Lifting industriel : éléments en inox sablés aux billes de verre sur place. Travail de précision sur chantier et chez le constructeur assure une finition uniforme et éclatante. Solution durable améliore l'efficacité et l'apparence de l'installation de transbordement."
  images: "overslagterminal/*.jpg"
  location: "Beringen"
  coordinates:
    lat: 51.048
    lng: 5.226

